<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technická podpora – VDF Games X</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Technická podpora – VDF Games X</h1>
    <p>Jak ti můžeme pomoct? Napiš, jaký máš problém.</p>

    <form id="question-form">
      <label for="question">Tvůj dotaz:</label>
      <textarea id="question" rows="5" required
        placeholder="Např.: Po poslední aktualizaci se mi hra nespustí..."></textarea>

      <label for="email">E-mail (nepovinné):</label>
      <input type="email" id="email" placeholder="tvuj@email.cz">

      <button type="submit">Odeslat dotaz</button>
    </form>

    <h2>Odpověď AI podpory:</h2>
    <div id="answer" role="status" aria-live="polite">Zatím žádný dotaz.</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
